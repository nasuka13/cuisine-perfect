<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mes Recettes Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#f97316' }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

    <!-- En-tête mobile -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/50 sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🍳</span>
            <h1 class="font-bold text-base tracking-tight bg-gradient-to-r from-orange-400 to-amber-400 bg-clip-text text-transparent">Mes Recettes</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="darkModeToggle" class="w-9 h-9 rounded-full bg-slate-700/50 flex items-center justify-center text-slate-300 active:scale-95 transition">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>
            <button onclick="openAuthModal()" class="w-9 h-9 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-user text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Conteneur principal (marge en bas pour la nav mobile) -->
    <main class="flex-grow px-4 py-4 pb-28 max-w-lg mx-auto w-full">

        <!-- SECTION 1 : RECETTES -->
        <section id="section-recettes" class="space-y-4">
            <div class="flex gap-2">
                <div class="relative flex-grow">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Rechercher..." class="w-full pl-9 pr-3 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-orange-500 transition">
                </div>
                <button onclick="openModal()" class="bg-primary active:scale-95 text-white px-3.5 py-2.5 rounded-xl font-medium transition flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
            </div>

            <!-- Grille Mobile 1 Colonne -->
            <div id="recipesGrid" class="space-y-3"></div>
        </section>

        <!-- SECTION 2 : FRIGO -->
        <section id="section-frigo" class="hidden space-y-4 animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-carrot text-orange-500"></i>
                    <span>Mon Frigo</span>
                </h2>
                <button onclick="openFridgeModal()" class="bg-orange-500 text-white text-xs px-3 py-2 rounded-xl font-medium flex items-center space-x-1 shadow-md">
                    <i class="fa-solid fa-plus"></i><span>Ajouter</span>
                </button>
            </div>
            <div id="fridgeListContainer" class="space-y-2"></div>
        </section>

        <!-- SECTION 3 : COURSES -->
        <section id="section-courses" class="hidden space-y-4 animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-cart-shopping text-orange-500"></i>
                    <span>Courses</span>
                </h2>
                <button onclick="openShoppingModal()" class="bg-orange-500 text-white text-xs px-3 py-2 rounded-xl font-medium flex items-center space-x-1 shadow-md">
                    <i class="fa-solid fa-plus"></i><span>Ajouter</span>
                </button>
            </div>
            <div id="shoppingListContainer" class="space-y-2"></div>
        </section>

        <!-- SECTION 4 : PLANNING -->
        <section id="section-planning" class="hidden space-y-4 animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-calendar-days text-orange-500"></i>
                    <span>Planning Semaine</span>
                </h2>
                <button onclick="openPlanningModal()" class="bg-orange-500 text-white text-xs px-3 py-2 rounded-xl font-medium flex items-center space-x-1 shadow-md">
                    <i class="fa-solid fa-plus"></i><span>Planifier</span>
                </button>
            </div>
            <div id="planningGrid" class="space-y-3"></div>
        </section>

        <!-- SECTION 5 : STATS -->
        <section id="section-stats" class="hidden space-y-4 animate-fade-in">
            <h2 class="text-lg font-bold flex items-center space-x-2">
                <i class="fa-solid fa-chart-pie text-orange-500"></i>
                <span>Statistiques</span>
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/60">
                    <p class="text-xs text-slate-400">Recettes</p>
                    <h3 id="statTotalRecipes" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/60">
                    <p class="text-xs text-slate-400">Articles Frigo</p>
                    <h3 id="statTotalFridge" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/60">
                    <p class="text-xs text-slate-400">À Acheter</p>
                    <h3 id="statTotalShopping" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/60">
                    <p class="text-xs text-slate-400">Repas Prévus</p>
                    <h3 id="statTotalPlanning" class="text-2xl font-bold mt-1">0</h3>
                </div>
            </div>
        </section>

        <!-- SECTION 6 : OUTILS -->
        <section id="section-outils" class="hidden space-y-4 animate-fade-in">
            <h2 class="text-lg font-bold flex items-center space-x-2">
                <i class="fa-solid fa-toolbox text-orange-500"></i>
                <span>Outils</span>
            </h2>
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/60 space-y-3">
                <h3 class="font-bold text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-stopwatch text-orange-500"></i>
                    <span>Minuteur Rapide</span>
                </h3>
                <div class="text-center">
                    <div id="timerDisplay" class="text-3xl font-mono font-bold my-2">00:00</div>
                    <div class="flex justify-center gap-2">
                        <button onclick="startTimer(300)" class="px-3 py-1.5 bg-slate-700 rounded-lg text-xs font-medium">5m</button>
                        <button onclick="startTimer(600)" class="px-3 py-1.5 bg-slate-700 rounded-lg text-xs font-medium">10m</button>
                        <button onclick="startTimer(900)" class="px-3 py-1.5 bg-slate-700 rounded-lg text-xs font-medium">15m</button>
                        <button onclick="stopTimer()" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-medium">Stop</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- BARRE DE NAVIGATION MOBILE FIXE (Bas de l'écran) -->
    <nav class="bg-slate-800/95 backdrop-blur-md border-t border-slate-700/50 fixed bottom-0 left-0 right-0 z-40 px-2 py-2 shadow-lg">
        <div class="flex justify-around items-center text-slate-400">
            <button onclick="switchTab('recettes')" class="nav-btn flex flex-col items-center space-y-0.5 text-orange-500 transition p-1" data-tab="recettes">
                <i class="fa-solid fa-book-open text-base"></i>
                <span class="text-[10px] font-medium">Recettes</span>
            </button>
            <button onclick="switchTab('frigo')" class="nav-btn flex flex-col items-center space-y-0.5 hover:text-orange-500 transition p-1" data-tab="frigo">
                <i class="fa-solid fa-carrot text-base"></i>
                <span class="text-[10px] font-medium">Frigo</span>
            </button>
            <button onclick="switchTab('courses')" class="nav-btn flex flex-col items-center space-y-0.5 hover:text-orange-500 transition p-1" data-tab="courses">
                <i class="fa-solid fa-cart-shopping text-base"></i>
                <span class="text-[10px] font-medium">Courses</span>
            </button>
            <button onclick="switchTab('planning')" class="nav-btn flex flex-col items-center space-y-0.5 hover:text-orange-500 transition p-1" data-tab="planning">
                <i class="fa-solid fa-calendar-days text-base"></i>
                <span class="text-[10px] font-medium">Planning</span>
            </button>
            <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center space-y-0.5 hover:text-orange-500 transition p-1" data-tab="stats">
                <i class="fa-solid fa-chart-pie text-base"></i>
                <span class="text-[10px] font-medium">Stats</span>
            </button>
            <button onclick="switchTab('outils')" class="nav-btn flex flex-col items-center space-y-0.5 hover:text-orange-500 transition p-1" data-tab="outils">
                <i class="fa-solid fa-toolbox text-base"></i>
                <span class="text-[10px] font-medium">Outils</span>
            </button>
        </div>
    </nav>

    <!-- MODALE GÉNÉRIQUE (Création Recette) -->
    <div id="recipeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-5 space-y-4 border-t sm:border border-slate-700 animate-slide-up">
            <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                <h3 class="font-bold text-base">Nouvelle Recette</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-300"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <form id="recipeForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nom *</label>
                    <input type="text" id="recipeTitle" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Catégorie</label>
                        <select id="recipeCategory" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                            <option value="Plat">Plat</option>
                            <option value="Entrée">Entrée</option>
                            <option value="Dessert">Dessert</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Difficulté</label>
                        <select id="recipeDifficulty" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                            <option value="Facile">Facile</option>
                            <option value="Moyen">Moyen</option>
                            <option value="Difficile">Difficile</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ingrédients (un par ligne)</label>
                    <textarea id="recipeIngredients" rows="3" placeholder="200g de farine&#10;3 oeufs" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Étapes</label>
                    <textarea id="recipeSteps" rows="3" placeholder="1. Mélanger..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-orange-500 rounded-xl font-bold text-sm text-white shadow-lg shadow-orange-500/20 active:scale-95 transition">Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- MODALE FRIGO -->
    <div id="fridgeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 space-y-4 border-t sm:border border-slate-700">
            <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                <h3 class="font-bold text-base">Ajouter au frigo</h3>
                <button onclick="closeFridgeModal()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <form id="fridgeForm" class="space-y-3">
                <input type="text" id="fridgeItemName" required placeholder="Nom (ex: Lait)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <input type="text" id="fridgeItemQty" required placeholder="Quantité (ex: 1L)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <input type="date" id="fridgeItemExpiry" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none text-slate-300">
                <button type="submit" class="w-full py-3 bg-orange-500 rounded-xl font-bold text-sm text-white active:scale-95 transition">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- MODALE COURSES -->
    <div id="shoppingModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 space-y-4 border-t sm:border border-slate-700">
            <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                <h3 class="font-bold text-base">Ajouter aux courses</h3>
                <button onclick="closeShoppingModal()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <form id="shoppingForm" class="space-y-3">
                <input type="text" id="shoppingItemName" required placeholder="Produit (ex: Tomates)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <input type="text" id="shoppingItemQty" placeholder="Quantité" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <button type="submit" class="w-full py-3 bg-orange-500 rounded-xl font-bold text-sm text-white active:scale-95 transition">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- MODALE PLANNING -->
    <div id="planningModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 space-y-4 border-t sm:border border-slate-700">
            <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                <h3 class="font-bold text-base">Planifier un repas</h3>
                <button onclick="closePlanningModal()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <form id="planningForm" class="space-y-3">
                <select id="planningDay" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                    <option value="Lundi">Lundi</option>
                    <option value="Mardi">Mardi</option>
                    <option value="Mercredi">Mercredi</option>
                    <option value="Jeudi">Jeudi</option>
                    <option value="Vendredi">Vendredi</option>
                    <option value="Samedi">Samedi</option>
                    <option value="Dimanche">Dimanche</option>
                </select>
                <select id="planningMealType" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                    <option value="Midi">Midi</option>
                    <option value="Soir">Soir</option>
                </select>
                <input type="text" id="planningRecipeName" required placeholder="Nom du plat" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <button type="submit" class="w-full py-3 bg-orange-500 rounded-xl font-bold text-sm text-white active:scale-95 transition">Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- MODALE AUTH -->
    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-5 space-y-4 border-t sm:border border-slate-700">
            <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                <h3 id="authModalTitle" class="font-bold text-base">Connexion</h3>
                <button onclick="closeAuthModal()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <form id="authForm" class="space-y-3">
                <input type="email" id="authEmail" required placeholder="Email" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <input type="password" id="authPassword" required placeholder="Mot de passe" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none">
                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-orange-500 rounded-xl font-bold text-sm text-white">Se connecter</button>
                <button type="button" onclick="toggleAuthMode()" id="authSwitchBtn" class="w-full text-xs text-slate-400 text-center py-1">Créer un compte</button>
            </form>
            <div id="loggedInArea" class="hidden space-y-3 text-center">
                <p class="text-xs text-slate-300">Connecté en tant que <br><strong id="currentEmail" class="text-orange-400"></strong></p>
                <button onclick="handleLogout()" class="w-full py-2.5 bg-red-500/20 text-red-400 rounded-xl text-sm font-medium">Se déconnecter</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
